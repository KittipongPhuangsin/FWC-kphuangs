<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            overflow-wrap: anywhere;
        }

        .first {
            background-color: rgb(248, 164, 9);
        }

        .second {
            background-color: rgb(5, 139, 180);
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first">
                First cell
            </td>

            <td class="second">
                Second cell
            </td>
        </tr>
    </table>

</body>
</html>
