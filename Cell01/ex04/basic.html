<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 80px;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .shop {
            width: 300px;
            min-width: 0;
            text-align: center;
        }

        .shop img {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        hr {
            margin-top: 24px;
        }

        footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Online Shops &hearts;</h1>

    <main class="shops">
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Shopee_logo.svg?utm_source=th.wikipedia.org&utm_campaign=index&utm_content=original" alt="Shopee">
            <a href="https://shopee.co.th/">Shopee</a>
        </div>
        <div class="shop">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsgQr77uFd2wZ_doRUxG5HArzj8Jvj0gNh9brwNWYShUjXxaeo-CB7FqU&s=10" alt="iHAVECPU">
            <a href="https://ihavecpu.com/?srsltid=AU7gw4VK11xTsHPchT2GY9TNxJ-AqijSQnPg-yAQiHQjojcIhlRxDxnT">iHAVECPU</a>
        </div>
    </main>

    <hr>

    <footer>
        <p>&copy; kphuangs 2026</p>
    </footer>
</body>
</html>
